# JS-ComputeSim-313 topology.
# Official totals (competition problem statement AI-JIANGSU-Q36, archived in
# challenge_info.md): 313 in-use data centers, 271.8 EFlops, 1+13, metro 1 ms.
# Per-city EFlops and DC counts are NOT published. They are a labeled assumption:
# shares follow 2024 city GDP, then scale to those two official totals.
# GDP source: 江苏省统计局《2024年1-12月设区市地区生产总值》
# https://tj.jiangsu.gov.cn/art/2025/2/7/art_90208_11487052.html
# The 13 city rows sum to 137291.46 亿元; the same table's provincial total is
# 137008.03 亿元. Shares use the city-row sum, not the provincial total.

meta:
  simulator: JS-ComputeSim-313
  jiangsu_total_eflops: 271.8
  jiangsu_dc_count: 313
  gdp_city_sum_100m_cny: 137291.46
  gdp_province_100m_cny: 137008.03
  allocation: assumption_gdp_share
  latency_ms:
    metro: 1.0
    intra_province: 5.0
    yangtze: 10.0
  # Design parameters from YOU-268, consistent with the published “城域 1ms 时延圈”.
  # They are not a measured RTT matrix.

# Order matches the statistics bureau table, then three Yangtze hubs.
# pue_base is an assumption inside the issue range 1.16–1.48. It is not a
# metered PUE. Carbon factors are provincial values from the same 2022 table
# (see configs/energy.yaml); every Jiangsu city uses Jiangsu's factor.
