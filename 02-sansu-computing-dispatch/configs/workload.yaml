# Seven-day workload prior.
# The five-class mix and the diurnal vectors are scenario assumptions. They are
# motivated by published qualitative trace facts (see docs/DATA_CONSTRUCTION.md)
# and are not a fit to Alibaba, Helios or Philly rows.
# Episode: 7 days × 24 hours. Day 1 = hours 0–23. Day 4 = hours 72–95.
# Day 0 of the episode is treated as Monday, so days 5–6 are the weekend.

episode_hours: 168

# Mean offered load as a fraction of Jiangsu nameplate (271.8 EFlops), before
# diurnal, weekend and lognormal noise. Hubs are extra supply. Assumption.
offered_load_fraction: 0.65

# Class mix. Sums to 1. Assumption.
task_mix:
  pretrain: 0.16
  finetune: 0.16
  inference: 0.42
  hpc: 0.08
  general: 0.18

# Unnormalized diurnal shapes (hour 0 … 23). The loader divides by the mean.
# Inference/general: daytime tide. Pretrain/finetune: higher at night.
# This night training peak is a contest scenario. Helios (Hu et al., SC 2021)
# reports only a 5–8% night utilization dip on training-dominated clusters.
diurnal:
  pretrain:  [1.40, 1.45, 1.50, 1.45, 1.35, 1.20, 0.90, 0.75, 0.70, 0.65, 0.60, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 1.00, 1.10, 1.20, 1.30, 1.35, 1.40]
  finetune:  [1.20, 1.25, 1.30, 1.25, 1.15, 1.00, 0.80, 0.75, 0.80, 0.85, 0.90, 0.95, 0.90, 0.85, 0.80, 0.85, 0.95, 1.05, 1.10, 1.15, 1.20, 1.25, 1.25, 1.20]
  inference: [0.35, 0.30, 0.28, 0.28, 0.30, 0.40, 0.70, 0.95, 1.15, 1.25, 1.30, 1.20, 1.15, 1.25, 1.40, 1.50, 1.55, 1.45, 1.30, 1.15, 1.00, 0.80, 0.60, 0.45]
  hpc:       [1.10, 1.10, 1.05, 1.05, 1.00, 1.00, 0.95, 0.95, 1.00, 1.05, 1.05, 1.00, 1.00, 1.05, 1.10, 1.10, 1.05, 1.00, 0.95, 1.00, 1.05, 1.10, 1.10, 1.10]
  general:   [0.40, 0.35, 0.32, 0.32, 0.35, 0.45, 0.75, 1.05, 1.20, 1.25, 1.20, 1.10, 1.05, 1.15, 1.25, 1.30, 1.25, 1.15, 1.05, 0.90, 0.75, 0.60, 0.50, 0.42]

# Assumption. Weng et al. only say weekday submissions are "slightly higher".
weekend_scale:
  pretrain: 1.00
  finetune: 0.95
  inference: 0.90
  hpc: 0.97
  general: 0.88

# Multiplicative lognormal noise with mean 1. Assumption.
lognormal_sigma: 0.05

# SLA and deadlines. Latency SLA is compared with the design latency matrix.
# Inference at 5 ms can move inside Jiangsu and cannot cross to a hub.
# Assumptions, editable here.
sla_latency_ms:
  pretrain: 10.0
  finetune: 10.0
  inference: 5.0
  hpc: 10.0
  general: 5.0
deadline_hours:
  pretrain: 24
  finetune: 8
  inference: 1
  hpc: 12
  general: 4
priority:
  pretrain: 1
  finetune: 2
  inference: 3
  hpc: 2
  general: 1

# Extra inference bursts. Independent of the diurnal curve. Assumption.
burst:
  probability_per_hour: 0.06
  multiplier_of_inference_mean: 1.2
  priority: 4

# Origin weights = city GDP × tilt, renormalized. Hubs originate no demand.
# Tilts are assumptions that make 苏南 inference-heavy relative to GDP.
origin_region_tilt:
  pretrain:  {sunan: 1.0, suzhong: 1.0, subei: 1.0, yangtze: 0.0}
  finetune:  {sunan: 1.2, suzhong: 1.0, subei: 0.9, yangtze: 0.0}
  inference: {sunan: 1.8, suzhong: 1.0, subei: 0.55, yangtze: 0.0}
  hpc:       {sunan: 1.1, suzhong: 1.0, subei: 0.9, yangtze: 0.0}
  general:   {sunan: 1.5, suzhong: 1.0, subei: 0.7, yangtze: 0.0}
